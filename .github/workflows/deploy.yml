name: Deploy

# Staging deploys automatically after CI passes on main. Production deploys only from a manual
# run (or a v* tag) against the protected "production" GitHub Environment (requires approval).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ${{ (github.event_name == 'push' || inputs.target == 'production') && 'production' || 'staging' }}
    concurrency: deploy-${{ (github.event_name == 'push' || inputs.target == 'production') && 'production' || 'staging' }}
    env:
      TARGET: ${{ (github.event_name == 'push' || inputs.target == 'production') && 'production' || 'staging' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations (never runs seed.sql)
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Build site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_APP_ENV: ${{ env.TARGET }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -e
          SITE="${{ vars.SITE_URL }}"
          curl -fsS "$SITE/" | grep -q 'lang="ar"'
          curl -fsS -o /dev/null "$SITE/book/brows"
          curl -fsSI "$SITE/" | grep -qi 'content-security-policy'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${{ vars.VITE_SUPABASE_URL }}/functions/v1/manage-appointment" \
            -H 'content-type: application/json' -H "origin: $SITE" -d '{"token":"x","action":"view"}')
          test "$code" = "404"
